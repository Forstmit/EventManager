services:
  db:
    image: postgres:16-alpine
    container_name: eventmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_manager
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: eventmanager_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://event_user:event_password@db:5432/event_manager
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
